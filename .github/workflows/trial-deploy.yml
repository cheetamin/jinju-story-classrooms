name: Manual Free-plan trial deployment
on:
  workflow_dispatch:
    inputs:
      workers_free_confirmed:
        description: 'Workers Free·별도 시험 DB 확인'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: free-trial-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ inputs.workers_free_confirmed }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: free-trial
    env:
      CONFIRM_WORKERS_FREE: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Require existing trial resources
        env:
          TRIAL_D1_ID: ${{ secrets.TRIAL_D1_ID }}
        run: |
          node -e 'const fs=require("fs"); const id=process.env.TRIAL_D1_ID; if(!/^[a-f0-9-]{36}$/.test(id||"")) throw Error("Set a separate trial DB ID first"); const c=JSON.parse(fs.readFileSync("wrangler.external.jsonc")); c.d1_databases[0].database_id=id;fs.writeFileSync("wrangler.external.jsonc",JSON.stringify(c,null,2));'
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm check:free
      - name: Apply additive migrations to the separate trial DB
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e 'if(!process.env.CLOUDFLARE_API_TOKEN||!process.env.CLOUDFLARE_ACCOUNT_ID)throw Error("Configure trial credentials first")'
          pnpm exec wrangler d1 migrations apply jinju-story-staging --remote --config wrangler.external.jsonc
      - run: pnpm build:external
      - name: Deploy the confirmed Free-plan trial
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm deploy:external
